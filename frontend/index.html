<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Pollo - Múltiples Dashboards">
    <title>Sistema de Gestión - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="assets/images/favicon.ico">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="assets/icons/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard-style.css">

    <!-- Tema Oscuro Global -->
    <link rel="stylesheet" href="css/dark-theme.css">
    <style>
        html,
        body {
            overflow: hidden;
            height: 100%;
            height: 100dvh;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: margin-left 0.3s ease;
        }

        .content-wrapper main {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #dashboardFrame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: none;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 350px;
            background: linear-gradient(180deg, #163a9c 0%, #1a43c7 100%);
            /* Aseguramos la transición suave tanto para transform como para width */
            transition: transform 0.3s ease, width 0.3s ease;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar.collapsed {
            width: 140px;
            /* Quitamos el overflow-x molesto durante la animación */
            overflow: hidden;
        }


        /* Scrollbar del sidebar: track transparente (vertical y horizontal) */
        .sidebar nav::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .sidebar nav::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar nav::-webkit-scrollbar-corner,
        .sidebar::-webkit-scrollbar-corner {
            background: transparent;
        }

        .sidebar nav::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar nav::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .sidebar nav,
        .sidebar {
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .toggle-sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .menu-item {
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 48px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: none;
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #60a5fa;
        }

        /* Alineación del contenido del item */
        .menu-item>span {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .menu-item>span>span {
            display: block;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.3;
            text-align: left;
        }

        /* ==================================================
           COMPORTAMIENTO DEL SIDEBAR COLAPSADO (ESTILO CLÁSICO + HOVER UX)
           ================================================== */
        @media (min-width: 1024px) {

            /* 1. Ocultar los submenús al colapsar para mantener el orden */
            .sidebar.collapsed .submenu {
                display: none !important;
            }

            /* 2. Restaurar el diseño que te gustaba: Ícono centrado arriba y texto abajo */
            .sidebar.collapsed .menu-item {
                justify-content: center;
                padding-left: 8px !important;
                padding-right: 8px !important;
                min-height: 65px;
                /* Le damos un poco más de altura para que quepa el texto */
            }

            /* Ocultar la flechita de la derecha (chevron) */
            .sidebar.collapsed .menu-item>i {
                display: none !important;
            }

            /* Apilar verticalmente el ícono y el texto */
            .sidebar.collapsed .menu-item>span {
                flex-direction: column;
                align-items: center;
                gap: 4px;
                width: 100%;
            }

            /* Formato del texto: pequeñito, centrado y que baje a la siguiente línea si es largo */
            .sidebar.collapsed .menu-item>span>span {
                font-size: 10.5px !important;
                /* Tamaño ideal para que se lea pero no sature */
                text-align: center !important;
                white-space: normal !important;
                word-wrap: break-word !important;
                line-height: 1.1 !important;
            }

            /* Ocultar el texto del logo ("Sistema Gestión") arriba y centrar el ícono principal */
            .sidebar.collapsed .sidebar-brand-text {
                display: none !important;
            }

            .sidebar.collapsed .sidebar-brand-row {
                justify-content: center;
            }

            /* Ocultar textos de usuario al colapsar y centrar el avatar */
            .sidebar.collapsed .sidebar-user-text {
                display: none !important;
            }

            .sidebar.collapsed .sidebar-user-section summary {
                justify-content: center;
            }

        }

        .sidebar.collapsed #accesoDirectoContainer p {
            display: none !important;
            /* Oculta el texto "Acceso rápido" */
        }

        .sidebar.collapsed #accesoDirectoContainer .flex {
            justify-content: center !important;
            /* Centra el botón visible */
        }

        .sidebar.collapsed #accesoDirectoContainer .flex button:not(:first-child) {
            display: none !important;
            /* Oculta todos los botones menos el primero */
        }

        /* Cuando el menú está tamaño Tablet (siempre 140px) */
        @media (min-width: 768px) and (max-width: 1023px) {
            #accesoDirectoContainer p {
                display: none !important;
            }

            #accesoDirectoContainer .flex {
                justify-content: center !important;
            }

            #accesoDirectoContainer .flex button:not(:first-child) {
                display: none !important;
            }
        }

        .menu-item>span>i {
            flex-shrink: 0;
            width: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-item>i {
            flex-shrink: 0;
            margin-left: auto;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* estado activo para enlaces y botones */
        .menu-link.active,
        .menu-item.active,
        .submenu-toggle.active {
            color: white !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        /* alternativa visual: sombra / fondo para botones activos */
        .menu-item.active,
        .submenu-toggle.active {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 4 6px 18px rgba(0, 0, 0, 0.25);
        }

        /* Submenu */
        .submenu.hidden {
            display: none !important;
        }

        .submenu:not(.hidden) {
            display: block;
        }

        .menu-link {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.4;
        }

        .submenu-toggle {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.3;
        }

        /* Content area - margin controlado por JS (syncContentMargin) */
        .content-wrapper {
            transition: margin-left 0.3s ease;
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: none;
            }

            .menu-toggle-mobile {
                display: none;
            }
        }

        /* Tablet: sidebar colapsado (140px) + contenido al lado cuando está abierto (768-1023px) */
        @media (min-width: 768px) and (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
                width: 140px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            /* Forzar estilo colapsado en tablet: iconos centrados, sin ellipsis */
            .sidebar.collapsed,
            .sidebar:not(.collapsed) {
                width: 140px;
            }

            .sidebar .sidebar-brand-text {
                display: none !important;
            }

            .sidebar .sidebar-brand-row {
                justify-content: center;
            }

            .sidebar .menu-item {
                justify-content: center;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            .sidebar .menu-item>i {
                display: none;
            }

            .sidebar .menu-item>span {
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .sidebar .menu-item>span>span {
                font-size: 10px;
                text-align: center;
                line-height: 1.1;
                white-space: normal;
                word-wrap: break-word;
            }

            .sidebar .menu-link {
                font-size: 10px;
                text-align: center;
                white-space: normal;
                word-wrap: break-word;
            }

            .sidebar .submenu {
                padding-left: 10px !important;
            }

            .sidebar .sidebar-user-text {
                display: none !important;
            }

            .sidebar .sidebar-user-section summary {
                justify-content: center;
            }
        }

        /* Móvil: ocultar sidebar (< 768px) */
        @media (max-width: 767px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
            }
        }

        /* Animaciones */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease;
        }

        /* Dashboard iframe - altura fija para scroll único */
        #dashboardFrame {
            width: 100%;
            border: none;
            background: #f9fafb;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

        <script>
            function toggleSubmenu(id, btn) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.toggle('hidden');
                
                if (btn) {
                    const chevron = btn.querySelector('.fa-chevron-down, .fa-chevron-right, .chevron-icon');
                    if (chevron) {
                        chevron.classList.toggle('rotate-180');
                    }
                }
            }

            const DASHBOARD_PROGRAMA = 'Planta de Incubacion';

            const slugify = (value) => {
                return value
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');
            };

            const buildSubmenuId = (value) => {
                return `submenu-${slugify(value)}`;
            };

            const buildMenuText = (fullText, shortHtml) => {
                const wrapper = document.createElement('span');
                wrapper.className = 'menu-text font-medium';

                const fullSpan = document.createElement('span');
                fullSpan.className = 'text-full';
                fullSpan.textContent = fullText || '';

                wrapper.appendChild(fullSpan);
                return wrapper;
            };

            const renderSidebarMenu = (items) => {
                const container = document.getElementById('sidebarMenu');
                if (!container) return;

                // FUNCIÓN DE LIMPIEZA CORREGIDA: No destruye palabras como "Configuración"
                const limpiarTextoModulo = (texto) => {
                    if (!texto) return '';

                    // 1. Insertar espacios en transiciones de minúscula a mayúscula (CamelCase)
                    let textoLimpio = texto.replace(/([a-z])([A-Z])/g, '$1 $2');

                    // 2. Eliminar sufijos técnicos específicos de desarrollo SOLO si están al final del texto
                    textoLimpio = textoLimpio.replace(/\s*Gest\.\s*Objetivos$/i, '');
                    textoLimpio = textoLimpio.replace(/\s*Config\s*Roles$/i, '');
                    textoLimpio = textoLimpio.replace(/\s*Objectives?$/i, '');
                    textoLimpio = textoLimpio.replace(/\s*(?:Carga\s+Pollo|bebeCarga|pollo\s+bebe)$/i, '');

                    // 3. Eliminar texto duplicado consecutivo
                    textoLimpio = textoLimpio.replace(/\b(\w+)\s+\1\b/gi, '$1');

                    // 4. Limpiar espacios múltiples
                    textoLimpio = textoLimpio.replace(/\s+/g, ' ');

                    return textoLimpio.trim();
                };

                container.innerHTML = '';

                const groups = items
                    .filter(item => item.tipo === 'group')
                    .sort((a, b) => a.orden - b.orden);

                const children = items
                    .filter(item => item.tipo === 'item')
                    .sort((a, b) => a.orden - b.orden);

                groups.forEach((group, groupIndex) => {
                    const menuGroup = document.createElement('div');
                    menuGroup.className = 'menu-group';

                    const submenuId = buildSubmenuId(group.cod_mod || group.nom_mod || 'menu');

                    const button = document.createElement('button');
                    button.className = 'menu-item flex items-center justify-between w-full px-4 py-3 text-white rounded-lg';

                    // Limpiar nombre del grupo
                    const cleanName = limpiarTextoModulo(group.nom_mod || '').replace(/^\d+(\.\d+)*\.\s*/, '');
                    const displayName = `${groupIndex + 1}. ${cleanName}`;
                    button.setAttribute('data-tooltip', displayName);
                    button.addEventListener('click', () => toggleSubmenu(submenuId));

                    const left = document.createElement('span');
                    left.className = 'flex items-center gap-3';

                    const icon = document.createElement('i');
                    icon.className = `${group.icono || 'fas fa-seedling'} w-5`;

                    left.appendChild(icon);

                    // CORRECCIÓN: Solo inyectamos el text-full
                    const wrapper = document.createElement('span');
                    wrapper.className = 'menu-text font-medium';
                    const fullSpan = document.createElement('span');
                    fullSpan.className = 'text-full';
                    fullSpan.textContent = displayName;
                    wrapper.appendChild(fullSpan);
                    left.appendChild(wrapper);

                    const chevron = document.createElement('i');
                    chevron.className = 'fas fa-chevron-down text-sm';

                    button.appendChild(left);
                    button.appendChild(chevron);

                    const submenu = document.createElement('div');
                    submenu.id = submenuId;
                    submenu.className = 'submenu hidden pl-10 mt-2 space-y-3.5';

                    const groupChildren = children.filter(child => child.parent_cod === group.cod_mod);

                    groupChildren.forEach((child, childIndex) => {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.className = 'menu-link block text-gray-400 hover:text-white';

                        if (child.permiso) {
                            link.setAttribute('data-permiso', child.permiso);
                        }

                        link.addEventListener('click', (event) => {
                            event.preventDefault();
                            const url = child.url || 'pages/trabajando.html';
                            const tipo = child.tipo_param || 'trabajando';
                            const titulo = child.titulo || child.nom_mod || 'Dashboard';
                            activateAndLoad(link, url, tipo, titulo);
                        });

                        const linkIcon = document.createElement('i');
                        linkIcon.className = `${child.icono || 'fas fa-chart-pie'} mr-2`;

                        const textWrapper = document.createElement('span');
                        textWrapper.className = 'menu-text';

                        // Limpiar nombre del elemento hijo
                        const cleanChildName = limpiarTextoModulo(child.nom_mod || '').replace(/^\d+(\.\d+)*\.\s*/, '');
                        const displayChildName = `${groupIndex + 1}.${childIndex + 1}. ${cleanChildName}`;

                        const childFullSpan = document.createElement('span');
                        childFullSpan.className = 'text-full';
                        childFullSpan.textContent = displayChildName;

                        // CORRECCIÓN: Ya no se genera el shortSpan para los hijos
                        textWrapper.appendChild(childFullSpan);

                        link.appendChild(linkIcon);
                        link.appendChild(textWrapper);
                        submenu.appendChild(link);
                    });

                    menuGroup.appendChild(button);
                    menuGroup.appendChild(submenu);
                    container.appendChild(menuGroup);
                });
            };
            // Hacer disponible globalmente para el MenuController
            window.renderSidebarMenu = renderSidebarMenu;

            const loadSidebarMenu = async () => {
                try {
                    console.log('🔍 Cargando menú del sidebar (MenuNavController)...');
                    if (window.menuPrincipal) {
                        await window.menuPrincipal.init();
                    } else {
                        console.error('❌ menuPrincipal no está instanciado.');
                    }
                } catch (error) {
                    console.error('❌ Error al cargar menu:', error);
                }
            };
        </script>

    <script>
        // =========================================================
        // VARIABLES GLOBALES PARA RESTAURACIÓN DE ESTADO
        // =========================================================
        window.restauracionActiva = false;
        window.enrutamientoActivo = new URLSearchParams(window.location.search).has('vista');

        function volverAlInicio() {
            sessionStorage.removeItem('last_dashboard_url');
            sessionStorage.removeItem('last_dashboard_tipo');
            sessionStorage.removeItem('last_dashboard_title');
        }

        // =========================================================
        // CARGA DE DASHBOARDS Y GUARDADO EN SESIÓN
        // =========================================================
        function loadDashboard(url, element) {
            event.preventDefault();
            showLoading();

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            const frame = document.getElementById('dashboardFrame');
            frame.src = url;

            const titles = {
                'dashboard-capturas.html': 'Capturas de Pantalla',
                'dashboard-comercializacion.html': 'Información del Mercado'
            };
            document.getElementById('dashboardTitle').textContent = titles[url] || 'Dashboard';

            if (window.innerWidth < 1024) {
                toggleSidebarCollapse();
            }
        }

        function loadDashboardAndData(dashboardUrl, tipo, title) {
            // ESCUDO: Evita cargar Bienvenida si estamos restaurando un F5
            if ((window.enrutamientoActivo || window.restauracionActiva) && (dashboardUrl === 'pages/bienvenida.html' || dashboardUrl === '')) {
                return;
            }

            // GUARDAR ESTADO ACTIVO EN SESSION STORAGE
            if (dashboardUrl && dashboardUrl !== 'pages/bienvenida.html') {
                sessionStorage.setItem('last_dashboard_url', dashboardUrl);
                sessionStorage.setItem('last_dashboard_tipo', tipo || '');
                sessionStorage.setItem('last_dashboard_title', title || '');
            } else if (dashboardUrl === 'pages/bienvenida.html' || dashboardUrl === '') {
                sessionStorage.removeItem('last_dashboard_url');
                sessionStorage.removeItem('last_dashboard_tipo');
                sessionStorage.removeItem('last_dashboard_title');
            }

            const frame = document.getElementById('dashboardFrame');
            const titulo = document.getElementById('dashboardTitle');
            
            const titles = {
                'dashboard-capturas.html': 'Gestion ' + title,
                'dashboard-control-objetivos.html': title,
                'dashboard-timeline-objetivos.html': title,
                'dashboard-confirmacion-objetivos.html': title,
                'dashboard-tareas.html': title,
                'pages/trabajando.html': title
            };

            titulo.textContent = titles[dashboardUrl] || title || 'Dashboard';
            showLoading();

            const run = () => {
                try {
                    if (frame.contentWindow && typeof frame.contentWindow.cargarDatos === 'function') {
                        frame.contentWindow.cargarDatos(tipo);
                    }
                } finally {
                    hideLoading();
                }
            };

            if (frame.src.includes(dashboardUrl)) {
                run();
            } else {
                frame.onload = run;
                frame.src = dashboardUrl;
            }

            if (window.innerWidth < 1024) toggleSidebarCollapse();
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }

        function markActiveElement(element) {
            document.querySelectorAll('.menu-link.active, .menu-item.active, .submenu-toggle.active')
                .forEach(el => el.classList.remove('active'));

            if (!element) return;
            element.classList.add('active');

            const parentToggle = findParentToggleButton(element);
            if (parentToggle) parentToggle.classList.add('active');

            const menuGroup = element.closest('.menu-group');
            if (menuGroup) {
                const topMenuItem = menuGroup.querySelector('.menu-item');
                if (topMenuItem) topMenuItem.classList.add('active');
            }
        }

        function findParentToggleButton(el) {
            let node = el;
            while (node && node !== document) {
                if (node.classList && node.classList.contains('submenu')) {
                    let prev = node.previousElementSibling;
                    if (prev && prev.tagName === 'BUTTON') return prev;
                }
                node = node.parentElement;
            }
            node = el.closest('.menu-group');
            if (node) {
                const innerToggle = node.querySelector('.submenu-toggle');
                if (innerToggle) return innerToggle;
            }
            return null;
        }

        function selectMenuItem(element) {
            markActiveElement(element);
        }

        function activateAndLoad(buttonOrLink, dashboardUrl, tipo, title) {
            markActiveElement(buttonOrLink);
            loadDashboardAndData(dashboardUrl, tipo, title);
        }

        // =========================================================
        // LÓGICA DE SIDEBAR, EFECTO HOVER Y RESPONSIVE
        // =========================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const contentWrapper = document.querySelector('.content-wrapper');

        function initSidebar() {
            if (window.innerWidth >= 1024) {
                sidebar.classList.remove('pinned');
                sidebar.classList.add('collapsed');
                sidebar.classList.add('open');
                if (overlay) overlay.classList.remove('active');
            } else if (window.innerWidth >= 768) {
                sidebar.classList.add('open');
                sidebar.classList.remove('collapsed');
                sidebar.classList.remove('pinned');
                if (overlay) overlay.classList.remove('active');
            } else {
                sidebar.classList.remove('open');
                sidebar.classList.remove('collapsed');
                sidebar.classList.remove('pinned');
                if (overlay) overlay.classList.remove('active');
            }
            syncContentMargin();
        }

        function syncContentMargin() {
            if (!contentWrapper) return;
            if (window.innerWidth >= 1024) {
                contentWrapper.style.marginLeft = sidebar.classList.contains('pinned') ? '350px' : '140px';
            } else if (window.innerWidth >= 768) {
                contentWrapper.style.marginLeft = sidebar.classList.contains('open') ? '140px' : '0px';
            } else {
                contentWrapper.style.marginLeft = '0px';
            }
        }

        if (sidebar) {
            sidebar.addEventListener('mouseenter', () => {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove('collapsed'); 
                }
            });

            sidebar.addEventListener('mouseleave', () => {
                if (window.innerWidth >= 1024 && !sidebar.classList.contains('pinned')) {
                    sidebar.classList.add('collapsed'); 
                }
            });
        }

        function toggleSidebarCollapse() {
            if (window.innerWidth >= 1024) {
                sidebar.classList.toggle('pinned');
                if (sidebar.classList.contains('pinned')) {
                    sidebar.classList.remove('collapsed'); 
                } else {
                    sidebar.classList.add('collapsed'); 
                }
            } else {
                sidebar.classList.toggle('open');
                if (window.innerWidth < 768 && overlay) {
                    overlay.classList.toggle('active', sidebar.classList.contains('open'));
                }
            }
            syncContentMargin();
        }

        window.addEventListener('resize', initSidebar);

        // =========================================================
        // INICIALIZACIÓN (AQUÍ REVISAMOS EL F5 / RECARGA)
        // =========================================================
        window.addEventListener('DOMContentLoaded', async () => {
            
            // 1. Iniciar lógica del Sidebar (lo que me había cargado 😅)
            initSidebar();

            // 2. Iniciar permisos
            if (typeof PermisosManager !== 'undefined') {
                PermisosManager.init();
            }
            
            // 3. Esperar a que la API cargue el menú dinámico
            if (typeof loadSidebarMenu === 'function') {
                await loadSidebarMenu(); 
            }

            // 4. LÓGICA DE RESTAURACIÓN CON SESSION STORAGE (Al dar F5)
            const lastUrl = sessionStorage.getItem('last_dashboard_url');
            const lastTipo = sessionStorage.getItem('last_dashboard_tipo');
            const lastTitle = sessionStorage.getItem('last_dashboard_title');

            if (lastUrl) {
                window.restauracionActiva = true;
                
                // Cargar el iframe
                loadDashboardAndData(lastUrl, lastTipo, lastTitle);

                // Buscar el enlace activo usando el atributo data-url (asegúrate de haber hecho el PASO 1 de mi respuesta anterior)
                const activeLink = document.querySelector(`.menu-link[data-url="${lastUrl}"]`);
                
                if (activeLink) {
                    selectMenuItem(activeLink);

                    // Replicar la "magia" de expandir todas las carpetas padre
                    let currentNode = activeLink;
                    while (currentNode && currentNode.id !== 'sidebarMenu') {
                        if (currentNode.classList && currentNode.classList.contains('submenu')) {
                            currentNode.classList.remove('hidden'); // Abrir submenú
                            
                            const btnPadre = currentNode.previousElementSibling;
                            if (btnPadre && btnPadre.tagName === 'BUTTON') {
                                const flechaAbajo = btnPadre.querySelector('.fa-chevron-down');
                                const flechaDerecha = btnPadre.querySelector('.fa-chevron-right');
                                if (flechaAbajo) flechaAbajo.classList.add('rotate-180');
                                if (flechaDerecha) flechaDerecha.classList.add('rotate-90');
                            }
                        }
                        currentNode = currentNode.parentElement;
                    }

                    // Scrollear hacia el menú seleccionado
                    setTimeout(() => {
                        activeLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                }

                setTimeout(() => {
                    window.restauracionActiva = false;
                }, 500);

            } else {
                // Si no hay registro previo en SessionStorage, cargamos Bienvenida
                const frame = document.getElementById('dashboardFrame');
                if (frame) {
                    frame.src = 'pages/bienvenida.html';
                    const titulo = document.getElementById('dashboardTitle');
                    if (titulo) titulo.textContent = 'Bienvenido';
                    frame.onload = () => hideLoading();
                }
            }
        });
    </script>

    <!-- Validación de Sesión para Index.html -->
    <script>
        // Validar sesión al cargar el index.html
        (function () {
            // Verificar si hay sesión activa
            const isAuthenticated = sessionStorage.getItem('isAuthenticated');
            const usuario = sessionStorage.getItem('usuario');

            if (!isAuthenticated || !usuario || isAuthenticated !== 'true') {
                // No hay sesión válida, redirigir al login silenciosamente
                try {
                    if (window.top && window.top !== window) {
                        window.top.location.replace('/plantaincubacion/login.html');
                    } else {
                        window.location.replace('/plantaincubacion/login.html');
                    }
                } catch (e) {
                    window.location.replace('/plantaincubacion/login.html');
                }
                return;
            }

            // Escuchar mensajes del iframe sobre expiración de sesión
            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'SESSION_EXPIRED') {
                    // El iframe detectó sesión expirada, limpiar y redirigir
                    sessionStorage.clear();
                    localStorage.removeItem('lastActivity');
                    try {
                        if (window.top && window.top !== window) {
                            window.top.location.replace('/plantaincubacion/login.html');
                        } else {
                            window.location.replace('/plantaincubacion/login.html');
                        }
                    } catch (e) {
                        window.location.replace('/plantaincubacion/login.html');
                    }
                }
            });

            // Verificar la sesión periódicamente (cada 30 segundos)
            setInterval(function () {
                const stillAuth = sessionStorage.getItem('isAuthenticated');
                if (!stillAuth || stillAuth !== 'true') {
                    // Sesión expiró, limpiar y redirigir
                    sessionStorage.clear();
                    localStorage.removeItem('lastActivity');
                    try {
                        if (window.top && window.top !== window) {
                            window.top.location.replace('/plantaincubacion/login.html');
                        } else {
                            window.location.replace('/plantaincubacion/login.html');
                        }
                    } catch (e) {
                        window.location.replace('/plantaincubacion/login.html');
                    }
                }
            }, 30000); // Cada 30 segundos
        })();
    </script>

    <!-- Funcionalidad del botón de cambio de tema -->
    <script>
        (function () {
            const themeToggleBtn = document.getElementById('btn-theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            const body = document.body;
            const THEME_STORAGE_KEY = 'appTheme'; // Clave común para toda la aplicación
            const THEME_MODE_STORAGE_KEY = 'appThemeMode';

            function isManualThemeEnabled() {
                return localStorage.getItem(THEME_MODE_STORAGE_KEY) === 'manual';
            }

            function getSystemTheme() {
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light';
            }

            function resolveInitialTheme() {
                const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                if (isManualThemeEnabled() && (storedTheme === 'dark' || storedTheme === 'light')) {
                    return storedTheme;
                }

                return getSystemTheme();
            }

            // Función para aplicar el tema
            function applyTheme(theme) {
                const isDark = theme === 'dark';
                body.classList.toggle('dark-mode', isDark);
                body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

                if (themeIcon) {
                    themeIcon.textContent = isDark ? '☀️' : '🌙';
                }
                if (themeText) {
                    themeText.textContent = isDark ? 'Claro' : 'Oscuro';
                }
            }

            // Aplicar tema directamente dentro del iframe (fallback robusto)
            function applyThemeToIframe(theme) {
                const iframe = document.getElementById('dashboardFrame');
                if (!iframe) return;

                try {
                    const doc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (!doc || !doc.body) return;

                    const isDark = theme === 'dark';
                    doc.body.classList.toggle('dark-mode', isDark);
                    doc.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                    if (doc.documentElement) {
                        doc.documentElement.classList.toggle('dark-mode', isDark);
                        doc.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                    }
                } catch (error) {
                    // Si no se puede acceder al iframe, se mantiene postMessage como respaldo.
                }
            }

            // Función para notificar a los iframes sobre el cambio de tema
            function notifyIframesThemeChange(theme) {
                // 1) Aplicación directa para asegurar el estado visual
                applyThemeToIframe(theme);

                // 2) Notificación para que scripts del iframe reaccionen
                const iframe = document.getElementById('dashboardFrame');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        type: 'THEME_CHANGE',
                        theme: theme
                    }, '*');
                }
            }

            // Función para cambiar el tema
            function toggleTheme() {
                const currentTheme = body.classList.contains('dark-mode') ? 'dark' : 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                // Aplicar tema en el index
                applyTheme(newTheme);

                // Guardar en localStorage
                localStorage.setItem(THEME_STORAGE_KEY, newTheme);
                localStorage.setItem(THEME_MODE_STORAGE_KEY, 'manual');

                // Notificar a los iframes
                notifyIframesThemeChange(newTheme);
            }

            // Cargar el tema guardado en localStorage
            const savedTheme = resolveInitialTheme();
            applyTheme(savedTheme);
            notifyIframesThemeChange(savedTheme);

            // Agregar evento al botón
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', toggleTheme);
            }

            // Cuando se carga un nuevo iframe, aplicarle el tema actual
            const dashboardFrame = document.getElementById('dashboardFrame');
            if (dashboardFrame) {
                dashboardFrame.addEventListener('load', function () {
                    const currentTheme = resolveInitialTheme();
                    notifyIframesThemeChange(currentTheme);
                    setTimeout(() => notifyIframesThemeChange(currentTheme), 100);
                });
            }

            // Mientras no exista override manual, seguir tema del sistema operativo.
            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemThemeChange = function (event) {
                    if (isManualThemeEnabled()) {
                        return;
                    }

                    const systemTheme = event.matches ? 'dark' : 'light';
                    applyTheme(systemTheme);
                    notifyIframesThemeChange(systemTheme);
                };

                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', handleSystemThemeChange);
                } else if (typeof mediaQuery.addListener === 'function') {
                    mediaQuery.addListener(handleSystemThemeChange);
                }
            }

            // Escuchar cambios de tema desde los iframes
            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'THEME_CHANGE_FROM_IFRAME') {
                    const newTheme = event.data.theme;

                    // Aplicar tema en el index
                    applyTheme(newTheme);

                    // Guardar en localStorage
                    localStorage.setItem(THEME_STORAGE_KEY, newTheme);
                    localStorage.setItem(THEME_MODE_STORAGE_KEY, 'manual');
                }
            });
        })();
    </script>
