<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Artículos</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">

    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros De Artículos
            </h2>

            <div class="table-scroll overflow-x-auto">
                <table class="min-w-full" id="dataTableArticulos">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">#</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Codigo</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Descripcion</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">UND</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">LINEA</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P. UNIT</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">IGV%</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">ESTADO</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="9" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Artículo -->
    <div id="modalArticulo"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8 transform transition-all">

            <div class="bg-blue-800 p-4 rounded-t-2xl flex justify-between items-center">
                <h3 id="modalArticuloTitle" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-box"></i> Nuevo Artículo
                </h3>
                <button type="button" id="btnCerrarModalArticulo"
                    class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formArticulo" class="space-y-4">
                    <input type="hidden" id="articulo_is_edit" name="is_edit" value="false">

                    <!-- Grid de Inputs -->
                    <div class="grid grid-cols-12 gap-4">
                        
                        <!-- Código -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Código *</label>
                            <input type="text" id="aCodigo" name="codigo" required maxlength="8" placeholder="Código"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase font-mono">
                        </div>

                        <!-- Descripción -->
                        <div class="col-span-12 md:col-span-6">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
                            <input type="text" id="aDescri" name="descri" required maxlength="250" placeholder="Descripción del artículo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Unidad -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
                            <input type="text" id="aUnidad" name="unidad" maxlength="3" placeholder="Ej: UND"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase">
                        </div>

                        <!-- Peso -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Peso</label>
                            <input type="text" id="aPeso" name="peso" maxlength="5" placeholder="Peso"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Línea -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Línea</label>
                            <input type="text" id="aLin" name="lin" maxlength="3" placeholder="Línea"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Cta balance -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. balance</label>
                            <input type="text" id="aCuenta" name="cuenta" maxlength="8" placeholder="Cuenta"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta costo -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. costo</label>
                            <input type="text" id="aCtacos" name="ctacos" maxlength="8" placeholder="Costo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta cargo -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. cargo</label>
                            <input type="text" id="aCtacar" name="ctacar" maxlength="8" placeholder="Cargo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta abono -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. abono</label>
                            <input type="text" id="aCtaabo" name="ctaabo" maxlength="8" placeholder="Abono"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta venta -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. venta</label>
                            <input type="text" id="aCventa" name="c_venta" maxlength="8" placeholder="Venta"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta nueve -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. nueve</label>
                            <input type="text" id="aCtanue" name="ctanue" maxlength="8" placeholder="Nueve"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- P. unitario -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">P. unitario</label>
                            <input type="number" step="0.001" id="aPreuni" name="preuni" placeholder="0.000"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- P. venta -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">P. venta</label>
                            <input type="number" step="0.001" id="aPreven" name="preven" placeholder="0.000"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- P. US$ -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">P. US$</label>
                            <input type="number" step="0.001" id="aPredol" name="predol" placeholder="0.000"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- IGV % -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">IGV %</label>
                            <input type="number" step="0.01" id="aIgv" name="igv" value="18" placeholder="18.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Stock seg. -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Stock seg.</label>
                            <input type="number" step="0.01" id="aSafestk" name="safestk" placeholder="0.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Híbrido -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Híbrido</label>
                            <input type="text" id="aHibri" name="hibri" maxlength="1" placeholder="Híbrido"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Tipo -->
                        <div class="col-span-12 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                            <input type="text" id="aTipo" name="tipo" maxlength="4" placeholder="Tipo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Fecha precio -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha precio</label>
                            <input type="date" id="aFchpre" name="fchpre"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Fecha vcto -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha vcto</label>
                            <input type="date" id="aFchvcto" name="fchvcto"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Estado -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                            <select id="aEstado" name="estado"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                                <option value="A">A Activo</option>
                                <option value="I">I Inactivo</option>
                            </select>
                        </div>

                        <!-- tactivo -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">tactivo</label>
                            <select id="aTactivo" name="tactivo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                                <option value="S">S</option>
                                <option value="N">N</option>
                            </select>
                        </div>

                    </div>

                    <!-- Botones de Acción -->
                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                        <button type="button" id="btnCancelarArticulo"
                            class="px-6 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarArticulo"
                            class="px-6 py-2 text-white bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts de Librerías -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts de Lógica Integrada -->
    <script src="../js/config/config.js"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/modules/articulos/articulos.service.js"></script>
    <script src="../js/modules/articulos/articulos.controller.js"></script>


</body>

</html>
