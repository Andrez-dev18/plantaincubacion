<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo en Desarrollo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">
   

    <style>
        /* Estilos base refinados */
        body {
            font-family: 'Sora', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        .panel-wrap {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* DISEÑO REDEFINIDO: Más ancho, espacioso y con dimensiones fijas */
        .panel-card {
            background: #ffffff !important;
            border-radius: 24px;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -6px rgba(15, 23, 42, 0.08) !important;
            padding: 60px 50px !important;
            /* Más respiro interno */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 680px;
            /* Incrementamos de 520px a 680px para llenar el aire */
            min-height: 440px;
            /* Forzamos una altura mínima fija idéntica para ambos modos */
            box-sizing: border-box;
        }

        /* Icono tecnológico animado (Agrandado para dar peso visual) */
        .icon-container {
            width: 100px;
            height: 100px;
            background: #eff6ff !important;
            color: #2563eb !important;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 28px;
            position: relative;
        }

        .icon-gear-sub {
            position: absolute;
            font-size: 20px;
            bottom: 24px;
            right: 24px;
            background: #eff6ff !important;
            padding: 2px;
            border-radius: 50%;
        }

        /* Animación suave de rotación */
        .spin-slow {
            animation: spin 8s linear infinite;
        }

        .spin-reverse {
            animation: spin-back 4s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-back {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        .panel-badge {
            background: #e0f2fe !important;
            color: #0369a1 !important;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 24px;
            display: inline-block;
        }

        .panel-title {
            font-size: 28px;
            /* Subimos de 22px a 28px */
            font-weight: 700;
            color: #0f172a !important;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
        }

        .panel-subtitle {
            font-size: 15px;
            /* Más legible */
            line-height: 1.6;
            color: #64748b !important;
            margin: 0;
            max-w: 520px;
        }

        .panel-divider {
            width: 60px;
            height: 3px;
            background: #e2e8f0 !important;
            border-radius: 2px;
            margin: 32px 0;
        }

        .panel-note {
            font-size: 13px;
            color: #94a3b8 !important;
            font-weight: 500;
            margin: 0;
        }

        /* ── Blindaje estricto para Modo Oscuro (Evita el estiramiento por herencia) ── */
        body.dark-mode {
            background: #0f172a !important;
            color: #e2e8f0 !important;
        }

        body.dark-mode .panel-card {
            background: #111827 !important;
            border-color: #1e293b !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4) !important;
            min-height: 440px !important;
            /* Mantiene la misma escala que el modo claro */
            padding: 60px 50px !important;
        }

        body.dark-mode .icon-container {
            background: #1e293b !important;
            color: #3b82f6 !important;
        }

        body.dark-mode .icon-gear-sub {
            background: #1e293b !important;
        }

        body.dark-mode .panel-badge {
            background: #1e3a8a !important;
            color: #93c5fd !important;
        }

        body.dark-mode .panel-title {
            color: #f8fafc !important;
        }

        body.dark-mode .panel-subtitle {
            color: #94a3b8 !important;
        }

        body.dark-mode .panel-divider {
            background: #334155 !important;
        }
    </style>
</head>

<body>
    <main class="panel-wrap">
        <section class="panel-card">
            <span class="panel-badge">Módulo en Desarrollo</span>

            <div class="icon-container">
                <i class="fas fa-cog spin-slow"></i>
                <i class="fas fa-cog icon-gear-sub spin-reverse"></i>
            </div>

            <h1 class="panel-title">Sección en Preparación</h1>
            <p class="panel-subtitle">Estamos trabajando en la implementación de esta funcionalidad para integrarla a la
                plataforma de la planta.</p>

            <div class="panel-divider" aria-hidden="true"></div>

            <p class="panel-note"><i class="fas fa-info-circle me-1"></i>Agradecemos su paciencia.</p>
        </section>
    </main>

    <script src="../js/shared/utils/theme-sync.js"></script>
</body>

</html>
