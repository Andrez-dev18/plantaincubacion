<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - reporte stock</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">


    <link rel="stylesheet" href="../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">


</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Filtros -->
        <section id="filterSection"
            class="bg-white rounded-xl sm:rounded-2xl shadow-sm border border-gray-100 p-3 sm:p-6 mb-4 sm:mb-6 slide-down">

            <div id="headerToggleFiltros"
                class="flex items-center justify-between mb-4 border-b border-gray-100 pb-3 sm:border-none sm:pb-0 cursor-pointer group select-none transition-colors">

                <h2
                    class="text-lg sm:text-xl font-bold text-gray-700 flex items-center gap-2 group-hover:text-purple-600 transition-colors">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>

                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="btnLimpiarFiltros" onclick="event.stopPropagation();"
                        class="relative z-10 text-sm text-purple-600 hover:text-purple-800 font-semibold flex items-center gap-1 transition-colors px-2 py-1 rounded hover:bg-purple-50">
                        <i class="fas fa-times-circle"></i>
                        <span class="hidden sm:inline">Limpiar</span>
                    </button>

                    <div
                        class="text-gray-400 group-hover:text-purple-600 w-8 h-8 flex items-center justify-center transition-colors">
                        <i id="iconToggleFiltros" class="fas fa-chevron-up transition-transform duration-300"></i>
                    </div>
                </div>
            </div>

            <div id="filterContent"
                class="grid grid-cols-1 sm:grid-cols-12 gap-3 sm:gap-4 items-end transition-all duration-300 origin-top">

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="periodoTipo"
                        class="text-xs sm:text-sm font-medium text-gray-700 flex items-center gap-1 mb-1">
                        <i class="fas fa-calendar-alt text-purple-600 w-4 text-center"></i> Periodo
                    </label>
                    <select id="periodoTipo"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white">

                        <option value="ULTIMA_SEMANA">Última Semana</option>
                        <option value="POR_MES">Por mes</option>
                        <option value="ENTRE_MESES">Entre meses</option>
                        <option value="POR_FECHA" selected>Por fecha</option>
                        <option value="ENTRE_FECHAS">Entre fechas</option>
                    </select>
                </div>

                <div id="periodoPorFecha" class="sm:col-span-6 lg:col-span-2">
                    <label for="fechaUnica"
                        class="text-xs sm:text-sm font-medium text-gray-700 flex items-center gap-1 mb-1">
                        <i class="fas fa-calendar-day text-purple-600 w-4 text-center"></i> Fecha
                    </label>
                    <input id="fechaUnica" type="date"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                </div>

                <div id="periodoEntreFechas" class="hidden sm:col-span-12 lg:col-span-4 xl:col-span-3">
                    <div class="grid grid-cols-2 gap-2 sm:gap-3">
                        <div>
                            <label for="fechaInicio"
                                class="text-xs sm:text-sm font-medium text-gray-700 flex items-center gap-1 mb-1">
                                <i class="fas fa-calendar-alt text-purple-600 w-4 text-center"></i> Desde
                            </label>
                            <input id="fechaInicio" type="date"
                                class="w-full h-10 px-2 sm:px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                        </div>
                        <div>
                            <label for="fechaFin"
                                class="text-xs sm:text-sm font-medium text-gray-700 flex items-center gap-1 mb-1">
                                <i class="fas fa-calendar-alt text-purple-600 w-4 text-center"></i> Hasta
                            </label>
                            <input id="fechaFin" type="date"
                                class="w-full h-10 px-2 sm:px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                        </div>
                    </div>
                </div>

                <div id="periodoPorMes" class="hidden sm:col-span-6 lg:col-span-2">
                    <label for="mesUnico"
                        class="text-xs sm:text-sm font-medium text-gray-700 flex items-center gap-1 mb-1">
                        <i class="fas fa-calendar-alt text-purple-600 w-4 text-center"></i> Mes
                    </label>
                    <input id="mesUnico" type="month"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                </div>

                <div id="periodoEntreMeses" class="hidden sm:col-span-12 lg:col-span-4 xl:col-span-3">
                    <div class="grid grid-cols-2 gap-2 sm:gap-3">
                        <div>
                            <label for="mesInicio"
                                class="text-xs sm:text-sm font-medium text-gray-700 mb-1 flex items-center">
                                <i class="fas fa-hourglass-start mr-1 text-purple-600 w-4 text-center"></i> Inicio
                            </label>
                            <input id="mesInicio" type="month"
                                class="w-full h-10 px-2 sm:px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                        </div>
                        <div>
                            <label for="mesFin"
                                class="text-xs sm:text-sm font-medium text-gray-700 mb-1 flex items-center">
                                <i class="fas fa-hourglass-end mr-1 text-purple-600 w-4 text-center"></i> Fin
                            </label>
                            <input id="mesFin" type="month"
                                class="w-full h-10 px-2 sm:px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm">
                        </div>
                    </div>
                </div>

                <!--filter zona (almacen)-->
                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterZonaAlmacen" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-user-check text-purple-600 w-4 text-center"></i> Zona
                    </label>
                    <select id="filterZonaAlmacen"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterLineas" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-map-marker-alt text-purple-600 w-4 text-center"></i> Lineas
                    </label>
                    <select id="filterLineas"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterCodigos" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-map-marker-alt text-purple-600 w-4 text-center"></i> Codigos
                    </label>
                    <select id="filterCodigos"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterFormato" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-eye text-purple-600 w-4 text-center"></i> Mostrar En
                    </label>
                    <select id="filterFormato" name="formato"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white font-medium text-gray-800">
                        <option value="UNIDADES" selected>Unidades</option>
                        <option value="VALOR">Valor</option>
                        <option value="RESUMEN">Resumen</option>
                        <option value="PESO">Peso</option>
                    </select>
                </div>

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterQuiebre" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-folder-tree text-purple-600 w-4 text-center"></i> Quiebre Por
                    </label>
                    <select id="filterQuiebre" name="quiebre"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white font-medium text-gray-800">
                        <option value="ALMACEN" selected>Almacén</option>
                        <option value="CUENTA">Cuenta</option>
                        <option value="LINEA">Línea</option>
                    </select>
                </div>

                <div class="sm:col-span-6 lg:col-span-2">
                    <label for="filterAgruparLote" class="text-xs sm:text-sm font-medium text-gray-700 mb-1 block">
                        <i class="fa-solid fa-layer-group text-purple-600 w-4 text-center"></i> ¿Usar Lotes?
                    </label>
                    <select id="filterAgruparLote" name="agruparLote"
                        class="w-full h-10 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm bg-white font-medium text-gray-800">
                        <option value="NO" selected>No (General)</option>
                        <option value="SI">Sí (Por Lote)</option>
                    </select>
                </div>

                <div class="sm:col-span-12 lg:col-span-2 xl:col-span-2">
                    <button id="btnAplicarFiltros"
                        class="w-full h-10 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-filter"></i>
                        <span class="hidden lg:inline xl:hidden">Filtrar</span> <span
                            class="inline lg:hidden xl:inline">Aplicar Filtro</span>
                    </button>
                </div>

                <div class="sm:col-span-12 lg:col-span-2 xl:col-span-2">
                    <button id="btnExportarPDF"
                        class="w-full h-10 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-file-pdf"></i> <span class="inline lg:hidden xl:inline">Exportar
                            PDF</span>
                    </button>
                </div>

            </div>
        </section>

        <!-- Tabla stock -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 slide-down">

            <div class="pt-2">
                <h3 class="text-lg font-bold text-gray-800 mb-4 uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-file-invoice-dollar text-blue-600"></i> Reporte Registro de Stock
                </h3>

                <div class="overflow-x-auto border border-gray-300 rounded-lg shadow-sm">
                    <table id="tablaStock"
                        class="w-full border-collapse text-xs text-left border border-gray-300 whitespace-nowrap">
                        <!-- Cabecera Azul Corporativa Opaca e Inmune al Scroll -->
                        <thead class="text-white uppercase font-bold tracking-wider sticky top-0 z-10">
                            <tr>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300 text-center">Codigo</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300 text-center">Descripcion
                                </th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300 text-center">Inicio</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300">Entrada</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300">Consumo</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300 text-center">Ajuste</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300">Stock</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300">Diario</th>
                                <th class="px-3 py-2.5 bg-blue-700 border-b border-gray-300 text-right">Alcance</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700 divide-y divide-gray-200 bg-white">
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

    </div>


    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script src="../js/shared/utils/swal-helpers.js?v=20260323"></script>
    <script src="../js/shared/utils/theme-sync.js?v=20260325"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/core/Store.js"></script>
    <script src="../js/core/Component.js"></script>
    <script src="../js/components/SearchableSelect.js"></script>
    <script src="../js/utils/FormNavigation.js"></script>

    <script src="../js/modules/reportes/MultiSelectBuscador.js"></script>
    <script src="../js/modules/reportes/reporteStock.service.js"></script>
    <script src="../js/modules/reportes/reporteStock.controller.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.ReporteStockController) {
                window.ReporteStockController.init();
            }
        });

    </script>

</body>

</html>
