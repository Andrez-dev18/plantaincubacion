<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Empresas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">

    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros De Servicios
            </h2>

            <div class="table-scroll overflow-x-auto">
                <table class="min-w-full" id="dataTableServicios">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">#</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Codigo</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Descripcion
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">Funcion</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">NATU 1</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">NATU 2</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">GRUPO</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">ACCIONES
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Servicio -->
    <div id="modalServicio"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full my-8 transform transition-all">

            <div class="bg-blue-800 p-4 rounded-t-2xl flex justify-between items-center">
                <h3 id="modalServicioTitle" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-concierge-bell"></i> Nuevo Servicio
                </h3>
                <button type="button" id="btnCerrarModalServicio"
                    class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formServicio" class="space-y-4">
                    <input type="hidden" id="servicio_is_edit" name="is_edit" value="false">

                    <!-- Grid de Inputs -->
                    <div class="grid grid-cols-12 gap-4">
                        
                        <!-- Código -->
                        <div class="col-span-12 md:col-span-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Código *</label>
                            <input type="text" id="sCodi" name="codi" required maxlength="10" placeholder="Código"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase font-mono">
                        </div>

                        <!-- Descripción -->
                        <div class="col-span-12 md:col-span-8">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
                            <input type="text" id="sDescri" name="descri" required maxlength="150" placeholder="Descripción del servicio"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Cta. función -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. función</label>
                            <input type="text" id="sFuncio" name="funcio" maxlength="8" placeholder="Función"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta. natu. 1 -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. natu. 1</label>
                            <input type="text" id="sNatu1" name="natu_1" maxlength="8" placeholder="Natu 1"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta. natu. 2 -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. natu. 2</label>
                            <input type="text" id="sNatu2" name="natu_2" maxlength="8" placeholder="Natu 2"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Cta. nueve -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cta. nueve</label>
                            <input type="text" id="sCtanue" name="ctanue" maxlength="8" placeholder="Nueve"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                        </div>

                        <!-- Grupo -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Grupo</label>
                            <input type="text" id="sGrupo" name="grupo" maxlength="3" placeholder="Grupo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Tipo -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                            <input type="text" id="sTipo" name="tipo" maxlength="4" placeholder="Tipo"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Bien -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Bien</label>
                            <input type="text" id="sBien" name="bien" maxlength="4" placeholder="Bien"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- % -->
                        <div class="col-span-12 md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">% Detracción</label>
                            <input type="number" step="0.01" id="sPorc" name="porc" placeholder="0.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- Monto -->
                        <div class="col-span-12 md:col-span-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Monto</label>
                            <input type="number" step="0.01" id="sMonto" name="monto" placeholder="0.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                        <!-- IGV % -->
                        <div class="col-span-12 md:col-span-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">IGV %</label>
                            <input type="number" step="0.01" id="sIgv" name="igv" placeholder="0.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>

                    </div>

                    <!-- Botones de Acción -->
                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                        <button type="button" id="btnCancelarServicio"
                            class="px-6 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarServicio"
                            class="px-6 py-2 text-white bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts de Librerías -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts de Lógica Integrada -->
    <script src="../js/config/config.js"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/modules/servicios/servicios.service.js"></script>
    <script src="../js/modules/servicios/servicios.controller.js"></script>

    <script>
        // Función nativa para ver la contraseña
        function togglePasswordVisually(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>

</html>
