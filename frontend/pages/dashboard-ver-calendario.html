<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Calendario - Sistema GRS</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #f3f4f6; /* Gris claro suave */
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #374151;
        }

        .container-page {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Sombras y Card Styles */
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(229, 231, 235, 0.5);
            background: white;
            border-radius: 0.75rem;
        }

        /* Animaciones */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-down { animation: slideDown 0.4s ease; }

        /* Botón Volver */
        .btn-back-modern {
            background-color: white;
            color: #4b5563;
            border: 1px solid #d1d5db;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-back-modern:hover {
            background-color: #f9fafb;
            color: #2563eb;
            border-color: #2563eb;
            transform: translateX(-3px);
        }

        /* KPIs / Estadísticas */
        .stat-card-modern {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .stat-card-modern:hover {
            transform: translateY(-2px);
        }

        .stat-card-modern::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }

        .stat-border-blue::before { background: #3b82f6; }
        .stat-border-green::before { background: #10b981; }
        .stat-border-orange::before { background: #f59e0b; }
        .stat-border-purple::before { background: #8b5cf6; }

        .stat-icon-bg {
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
        }

        /* DataTables Customization */
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.25rem 2rem 0.25rem 0.5rem;
        }

        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.375rem;
            margin-left: 0.5rem;
        }

        table.dataTable.no-footer {
            border-bottom: 1px solid #e5e7eb;
        }

        table.dataTable thead th {
            background: #1e40af; /* Azul oscuro corporativo */
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            padding: 1rem !important;
            border-bottom: none !important;
        }
        
        /* Redondear esquinas del header de la tabla */
        table.dataTable thead th:first-child { border-top-left-radius: 0.5rem; }
        table.dataTable thead th:last-child { border-top-right-radius: 0.5rem; }

        table.dataTable tbody td {
            padding: 0.75rem 1rem !important;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        table.dataTable tbody tr:hover {
            background-color: #f8fafc !important;
        }

        /* Botones de Exportación DataTables */
        button.dt-button {
            background: white !important;
            color: #4b5563 !important;
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            font-size: 0.875rem !important;
            padding: 0.4rem 0.8rem !important;
            margin-bottom: 1rem !important;
            transition: all 0.2s !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        }

        button.dt-button:hover {
            background: #f3f4f6 !important;
            color: #1e40af !important;
            border-color: #1e40af !important;
        }

        /* Badges de fecha */
        .date-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .date-badge.green { background: #dcfce7; color: #166534; } /* Success */
        .date-badge.red { background: #fee2e2; color: #991b1b; } /* Danger */
        .date-badge.yellow { background: #fef3c7; color: #92400e; } /* Warning */
        .date-badge.blue { background: #dbeafe; color: #1e40af; } /* Info */

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }

        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="text-center">
            <div class="spinner mx-auto mb-3"></div>
            <p class="text-gray-600 font-medium">Cargando calendario...</p>
        </div>
    </div>

    <main class="container-page">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 slide-down">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-3">
                    <span class="bg-indigo-600 text-white p-2 rounded-lg text-lg"><i class="fas fa-calendar-alt"></i></span>
                    Calendario de Fechas
                </h1>
                <div class="flex items-center gap-2 mt-2 text-sm text-gray-500">
                    <span class="font-semibold text-indigo-600">Proyección:</span>
                    <span id="proyeccionTitle" class="bg-gray-100 px-2 py-0.5 rounded border border-gray-200">Cargando...</span>
                </div>
            </div>

            <button class="btn-back-modern mt-4 md:mt-0" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
                Regresar al panel
            </button>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 slide-down">
            
            <div class="stat-card-modern stat-border-blue">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Fechas</p>
                    <div class="stat-value text-2xl font-bold text-gray-800 mt-1" id="statTotal">0</div>
                </div>
                <div class="stat-icon-bg bg-blue-50 text-blue-600">
                    <i class="fas fa-list-ol"></i>
                </div>
            </div>

            <div class="stat-card-modern stat-border-green">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Galpones Activos</p>
                    <div class="stat-value text-2xl font-bold text-gray-800 mt-1" id="statGalpones">0</div>
                </div>
                <div class="stat-icon-bg bg-green-50 text-green-600">
                    <i class="fas fa-warehouse"></i>
                </div>
            </div>

            <div class="stat-card-modern stat-border-orange">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Inicio Campaña</p>
                    <div class="stat-value text-lg font-bold text-gray-800 mt-1" id="statPrimeraFecha">-</div>
                </div>
                <div class="stat-icon-bg bg-orange-50 text-orange-600">
                    <i class="fas fa-play"></i>
                </div>
            </div>

            <div class="stat-card-modern stat-border-purple">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Fin Estimado</p>
                    <div class="stat-value text-lg font-bold text-gray-800 mt-1" id="statUltimaFecha">-</div>
                </div>
                <div class="stat-icon-bg bg-purple-50 text-purple-600">
                    <i class="fas fa-flag-checkered"></i>
                </div>
            </div>

        </section>

        <section class="bg-white rounded-xl card-shadow p-6 slide-down">
            <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-table text-indigo-500"></i> Detalle de Programación
            </h2>
            
            <div class="table-responsive">
                <table id="tablaCalendario" class="display responsive nowrap w-full text-left">
                    <thead>
                        <tr>
                            <th>Campaña</th>
                            <th>Galpón</th>
                            <th>Fecha AQP</th>
                            <th>Fecha Liquidación</th>
                            <th>Fecha Limpieza</th>
                            <th>Fecha Desp/Nuevo</th>
                            <th>Días Totales</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="../js/core/Store.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/config/config.js"></script>
    
    <script>
        if (typeof AppStore === 'undefined') {
            window.AppStore = new Store({
                user: null,
                isAuthenticated: false,
                loading: false
            });
        }
    </script>
    
    <script src="../js/modules/secuencia-base-proyeccion/secuencia-base-proyeccion.service.js"></script>
    <script src="../js/modules/secuencia-base-proyeccion/VerCalendarioController.js"></script>
    
    <script>
        // Inicializar controlador
        document.addEventListener('DOMContentLoaded', () => {
            // Pequeña corrección visual para DataTables cuando carga
            setTimeout(() => {
                $(window).trigger('resize');
            }, 500);
            
            new VerCalendarioController();
        });
    </script>
</body>
</html>
