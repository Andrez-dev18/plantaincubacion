<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Empresas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">

    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros De Empresas
            </h2>

            <div class="table-scroll overflow-x-auto">
                <table class="min-w-full" id="dataTableEmpresas">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">#</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Codigo CCTE</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">Nombre</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">SERIE FT</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">URL GUIFAC</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">ACTIVO</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Empresa -->
    <div id="modalEmpresa"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full my-8 transform transition-all">

            <div class="bg-blue-800 p-4 rounded-t-2xl flex justify-between items-center">
                <h3 id="modalEmpresaTitle" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-building"></i> Nueva Empresa
                </h3>
                <button type="button" id="btnCerrarModalEmpresa" class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formEmpresa" class="space-y-5">
                    <input type="hidden" id="empresa_is_edit" name="is_edit" value="false">
                    <input type="hidden" id="empresa_id" name="id" value="">

                    <!-- Código CCTE / RUC -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor (CCTE) *</label>
                        <div id="ccteSelectContainer" class="relative">
                            <select id="empresa_ccte" name="ruc" required class="w-full select2-ccte border border-gray-300 rounded-lg outline-none">
                                <option value="">Seleccione un proveedor...</option>
                            </select>
                        </div>
                        <div id="ccteInputContainer" class="relative hidden">
                            <input type="text" id="empresa_ccte_readonly" readonly class="w-full pl-3 pr-4 py-2 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed outline-none font-semibold">
                        </div>
                    </div>

                    <!-- Nombre de Empresa -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre / Razón Social *</label>
                        <div class="relative">
                            <i class="fas fa-building absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="empresa_nombre" name="nombre" required placeholder="Nombre de la empresa"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                    </div>

                    <!-- Serie CPE FT -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Serie CPE Factura *</label>
                        <div class="relative">
                            <i class="fas fa-receipt absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="empresa_serie" name="serie_cpe_ft" value="F001" required placeholder="Ej: F001" maxlength="4"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase">
                        </div>
                        <p class="text-xs text-gray-400 mt-1">Código de 4 caracteres.</p>
                    </div>

                    <!-- URL GuiFac -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL GuiFac *</label>
                        <div class="relative">
                            <i class="fas fa-link absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="url" id="empresa_url" name="guifac_url" value="https://demo.guifacperu.com/" required placeholder="Ej: https://api.guifac.com/v1"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                    </div>

                    <!-- Token GuiFac -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Token GuiFac *</label>
                        <div class="relative">
                            <i class="fas fa-key absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="empresa_token" name="guifac_token" required placeholder="Token de autenticación"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                    </div>

                    <!-- Activo -->
                    <div class="flex items-center">
                        <input type="checkbox" id="empresa_activo" name="activo" checked value="1"
                            class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded">
                        <label for="empresa_activo" class="ml-2 block text-sm text-gray-900 font-medium">Habilitado / Activo</label>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                        <button type="button" id="btnCancelarEmpresa"
                            class="px-6 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarEmpresa"
                            class="px-6 py-2 text-white bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts de Librerías -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts de Lógica Integrada -->
    <script src="../js/config/config.js"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/modules/empresas/empresas.service.js"></script>
    <script src="../js/modules/empresas/empresas.controller.js"></script>

    <script>
        // Función nativa para ver la contraseña
        function togglePasswordVisually(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>

</html>
