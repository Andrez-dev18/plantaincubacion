<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyecciones - Sistema GRS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    
    <link rel="stylesheet" href="../assets/icons/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/scroller/2.3.0/css/scroller.dataTables.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">

</head>
<body>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner mb-4"></div>
        <h3 class="text-lg font-semibold text-gray-700">Cargando Sistema...</h3>
        <p class="text-sm text-gray-500">Por favor espere</p>
    </div>

    <main class="container-page">
        <!-- Header eliminado -->

        <!-- Acciones -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-4 slide-down">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-tools text-blue-600"></i>
                    Acciones
                </h2>
                <!--<button id="btnContinuarPaso2" class="group bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white py-3 px-6 rounded-xl font-semibold shadow-md btn-hover-scale flex items-center gap-2 transition-all">
                    <span>Continuar al Paso 2</span>
                    <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>-->
            </div>
            <div class="flex flex-wrap gap-3">
                <button id="btnNueva" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    Nueva Proyección
                </button>
            </div>
        </section>

        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-xl shadow-md p-6 mb-4 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-filter text-blue-600"></i>
                    Filtros
                </h2>
                <button id="btnToggleFiltros" class="text-gray-500 hover:text-blue-600 transition">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="flex gap-3">
                    <button id="btnLimpiarFiltros" class="text-blue-600 hover:text-blue-700 font-semibold">
                        <i class="fas fa-times-circle mr-1"></i>
                        Limpiar filtros
                    </button>
                </div>
            </div>
            <div id="filterContent" class="transition-all duration-300 ease-in-out overflow-hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Búsqueda por texto -->
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-search text-blue-600 mr-1"></i>
                            Buscar
                        </label>
                        <input type="text" id="searchInput" placeholder="Nombre de proyección..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <!-- Filtro por Estado -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fas fa-list text-blue-600 mr-1"></i>
                            Estado
                        </label>
                        <select id="filterEstado" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="">Todos</option>
                            <option value="valid">Válido</option>
                            <option value="invalid">Inválido</option>
                        </select>
                    </div>
                </div>
                <!-- Botones de acción de filtros -->
                <div class="flex gap-2 mt-4">
                    <button id="btnAplicarFiltros" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fa-solid fa-filter mr-2"></i>
                        Filtrar
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <div class="p-5 border-b border-gray-100 bg-white flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="bg-blue-50 text-blue-600 p-2 rounded-lg">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">Listado de Proyecciones</h2>
                        <span id="totalProyecciones" class="text-xs font-semibold text-gray-400 uppercase tracking-wide">0 registros encontrados</span>
                    </div>
                </div>
            </div>
            <div class="relative bg-white">
                <div class="table-container">
                    <table id="tablaProyecciones">
                        <thead>
                            <tr>
                                <th class="w-24 text-center">ID</th>
                                <th class="text-left">Nombre de la Proyección</th>
                                <th class="w-40 text-center">Estado / Indicador</th>
                                <th class="w-44 text-center">Opciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyProyecciones">
                            <!-- Las filas se generan dinámicamente -->
                        </tbody>
                    </table>
                    <div id="emptyMessage" class="hidden flex flex-col items-center justify-center py-20 text-center">
                        <div class="bg-gray-50 p-6 rounded-full mb-4 shadow-inner">
                            <i class="fas fa-folder-open text-gray-300 text-5xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mb-1">No hay proyecciones</h3>
                        <p class="text-gray-500 text-sm max-w-xs mx-auto mb-6">Actualmente no existen registros. Comienza creando una nueva proyección.</p>
                        <button onclick="document.getElementById('btnNueva').click()" class="text-blue-600 font-semibold hover:underline text-sm">
                            + Crear primera proyección
                        </button>
                    </div>
                </div>
            </div>
            <!--<div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-between items-center text-xs text-gray-500">
                <div class="flex items-center gap-2">
                    <i class="fas fa-info-circle text-blue-400"></i>
                    <span>Haga clic en una fila para seleccionarla.</span>
                </div>
            </div>-->
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/scroller/2.3.0/js/dataTables.scroller.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="../js/core/Store.js"></script>
    <script src="../js/core/Service.js"></script>
    <script src="../js/core/Component.js"></script>
    <script src="../js/core/Http.js"></script>
    <script src="../js/config/config.js"></script>
    
    <script>
        if (typeof AppStore === 'undefined') {
            window.AppStore = new Store({
                user: null,
                isAuthenticated: false,
                loading: false
            });
        }
    </script>
    
    <script src="../js/shared/components/Modal.js"></script>
    <script src="../js/shared/components/Notification.js"></script>
    <script src="../js/shared/utils/swal-helpers.js"></script>
    <script src="../js/shared/utils/theme-sync.js?v=20260325"></script>
    
    <script src="../js/modules/auth/auth.service.js"></script>
    <script src="../js/modules/secuencia-base-proyeccion/secuencia-base-proyeccion.service.js"></script>
    <script src="../js/modules/secuencia-base-proyeccion/GestionProyeccionesController.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Validar sesión
            const authService = new AuthService();
            const sesion = await authService.validarSesion();
            if (!sesion.success) {
                window.location.href = '../login.html';
                return;
            }

            // Iniciar Controlador
            window.gestionProyeccionesController = new GestionProyeccionesController();

            // Animación de entrada
            const tableContainer = document.querySelector('.table-container');
            if(tableContainer) {
                tableContainer.scrollTop = 0;
            }

            // Filtros: replicar lógica de caracteristicas.html
            setTimeout(() => {
                // Toggle de filtros
                const btnToggleFiltros = document.getElementById('btnToggleFiltros');
                const filterContent = document.getElementById('filterContent');
                if (btnToggleFiltros && filterContent) {
                    filterContent.classList.remove('show');
                    btnToggleFiltros.addEventListener('click', () => {
                        const isOpen = filterContent.classList.contains('show');
                        const icon = btnToggleFiltros.querySelector('i');
                        if (isOpen) {
                            filterContent.classList.remove('show');
                            if (icon) {
                                icon.classList.remove('fa-chevron-up');
                                icon.classList.add('fa-chevron-down');
                            }
                        } else {
                            filterContent.classList.add('show');
                            if (icon) {
                                icon.classList.remove('fa-chevron-down');
                                icon.classList.add('fa-chevron-up');
                            }
                        }
                    });
                }

                // Limpiar filtros
                const btnLimpiarFiltros = document.getElementById('btnLimpiarFiltros');
                if (btnLimpiarFiltros) {
                    btnLimpiarFiltros.addEventListener('click', () => {
                        const searchInput = document.getElementById('searchInput');
                        const filterEstado = document.getElementById('filterEstado');
                        if (searchInput) searchInput.value = '';
                        if (filterEstado) filterEstado.value = '';
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.cargarProyecciones === 'function') {
                            window.gestionProyeccionesController.cargarProyecciones();
                        }
                    });
                }

                // Aplicar filtros
                const btnAplicarFiltros = document.getElementById('btnAplicarFiltros');
                if (btnAplicarFiltros) {
                    btnAplicarFiltros.addEventListener('click', () => {
                        const searchInput = document.getElementById('searchInput');
                        const filterEstado = document.getElementById('filterEstado');
                        const searchTerm = searchInput ? searchInput.value : '';
                        const estado = filterEstado ? filterEstado.value : '';
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.aplicarFiltros === 'function') {
                            window.gestionProyeccionesController.aplicarFiltros(searchTerm, estado);
                        }
                    });
                }

                // Buscar en tiempo real
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('keyup', (e) => {
                        const filterEstado = document.getElementById('filterEstado');
                        const estado = filterEstado ? filterEstado.value : '';
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.aplicarFiltros === 'function') {
                            window.gestionProyeccionesController.aplicarFiltros(e.target.value, estado);
                        }
                    });
                }

                // Filtro por estado
                const filterEstado2 = document.getElementById('filterEstado');
                if (filterEstado2) {
                    filterEstado2.addEventListener('change', () => {
                        const searchInput = document.getElementById('searchInput');
                        const searchTerm = searchInput ? searchInput.value : '';
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.aplicarFiltros === 'function') {
                            window.gestionProyeccionesController.aplicarFiltros(searchTerm, filterEstado2.value);
                        }
                    });
                }

                // Acciones
                const btnNueva = document.getElementById('btnNueva');
                if (btnNueva) {
                    btnNueva.addEventListener('click', () => {
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.mostrarFormularioNuevo === 'function') {
                            window.gestionProyeccionesController.mostrarFormularioNuevo();
                        }
                    });
                }
                const btnEditar = document.getElementById('btnEditar');
                if (btnEditar) {
                    btnEditar.addEventListener('click', () => {
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.mostrarFormularioEditar === 'function') {
                            window.gestionProyeccionesController.mostrarFormularioEditar();
                        }
                    });
                }
                const btnEliminar = document.getElementById('btnEliminar');
                if (btnEliminar) {
                    btnEliminar.addEventListener('click', () => {
                        if (window.gestionProyeccionesController && typeof window.gestionProyeccionesController.eliminarProyeccion === 'function') {
                            window.gestionProyeccionesController.eliminarProyeccion();
                        }
                    });
                }
            }, 1000);
        });
    </script>
</body>
</html>
